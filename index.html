<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>挑战德语 B1 高分</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        body {
            background-color: #F0F4F8; /* 稍有区别的清新底色 */
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        }

        /* 奖杯浮动动效 */
        @keyframes trophy-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .icon-box {
            font-size: 3.5rem;
            display: inline-block;
            will-change: transform;
            animation: trophy-float 3s ease-in-out infinite;
            margin-bottom: 1.5rem;
        }

        .main-title {
            color: #0F172A;
            font-weight: 900;
            letter-spacing: -0.01em;
            font-size: 1.85rem;
        }

        #code-input {
            color: #1E293B !important;
            font-weight: 900 !important;
            letter-spacing: 2px;
            caret-color: #4F46E5;
        }

        /* 采用更深邃的 B1 专属配色（深蓝到蓝紫） */
        .btn-gradient {
            background: linear-gradient(135deg, #1E40AF 0%, #312E81 100%);
            box-shadow: 0 10px 25px -5px rgba(30, 64, 175, 0.3);
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #CBD5E1, transparent);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="glass-card w-full max-w-[400px] rounded-[3.5rem] p-12 text-center relative">
        <header class="mb-10">
            <div class="icon-box">🏆</div>
            <h1 class="main-title">挑战德语 B1 高分</h1>
            <p class="text-[10px] text-slate-400 font-bold tracking-[0.2em] mt-2 uppercase">Level B1 • Prüfungstraining</p>
        </header>

        <div class="space-y-6">
            <input type="text" id="code-input" placeholder="请输入 B1 激活码" 
                   class="w-full bg-slate-50 border-2 border-slate-100 rounded-[1.5rem] p-5 focus:bg-white focus:border-blue-600 outline-none transition-all text-center shadow-inner">
            
            <button onclick="verify()" 
                    class="w-full btn-gradient text-white font-black py-5 rounded-[1.5rem] active:scale-[0.96] transition-all duration-200 text-lg">
                开启挑战
            </button>
        </div>
    </div>

    <footer class="mt-12 w-full max-w-[400px] text-center">
        <div class="divider mb-6"></div>
        <div class="text-slate-400 text-[11px] font-bold tracking-widest">
            © 2026 GEHTALLES 刘老师工作室 | B1 实战系列
        </div>
    </footer>

    <script>
        const ACCESS_KEY = 'map_access_b1'; // 独立 Key，不影响 A2
        const VALID_TOKEN = "Erfolg2026";    // B1 专用激活码

        // 自动登录检测
        if (localStorage.getItem(ACCESS_KEY) === VALID_TOKEN) {
            window.location.href = "main.html";
        }

        function verify() {
            const input = document.getElementById('code-input').value.trim();
            if (input === VALID_TOKEN) {
                localStorage.setItem(ACCESS_KEY, VALID_TOKEN);
                window.location.href = "main.html";
            } else if (input === "") {
                alert("请输入 B1 专属激活码哦！");
            } else {
                alert("激活码错误，请联系刘老师获取。");
            }
        }

        // 监听回车键
        document.getElementById('code-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verify();
        });
    </script>
</body>
</html>
